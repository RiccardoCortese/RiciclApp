openapi: 3.0.0
info:
  title: RiciclApp
  description: Documentazione delle API per il progetto RiciclApp.
  version: 1.0.0

servers:
  - url: http://localhost:5000/api  
    description: Server Locale (Sviluppo)

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrazione nuovo utente
      description: >
        Registra un nuovo utente nel sistema, genera un codice di verifica
        e invia una email per la conferma dell'account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - username
                - email
                - password

              properties:
                username:
                  type: string
                  example: Mario Rossi

                email:
                  type: string
                  format: email
                  example: mario.rossi@gmail.com

                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123

      responses:
        '201':
          description: Utente registrato con successo

        '400':
          description: Dati non validi o utente già registrato
 
        '500':
          description: Errore interno del server
         
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login utente
      description: Autentica un utente e restituisce token JWT e dati dell'utente, inclusivo del ruolo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@example.com"
                password:
                  type: string
                  example: "adminpassword"
      responses:
        '200':
          description: Login effettuato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "jwt-token"
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Credenziali mancanti o non valide
        '401':
          description: Email o password errati
        '500':
          description: Errore interno del server
  
  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: Verifica email utente
      description: Verifica il codice inviato via email e attiva l'account utente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: mario.rossi@gmail.com
                code:
                  type: string
                  example: "123456"

      responses:
        '200':
          description: Email verificata con successo

        '400':
          description: Codice errato

        '404':
          description: Utente non trovato

        '500':
          description: Errore interno del server
  /user/delete:
    delete:
      tags:
        - User
      summary: Elimina l'account dell'utente autenticato
      description: |
        Elimina l'account dell'utente autenticato tramite token JWT.
        Dopo l'eliminazione viene inviata una mail di conferma.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account eliminato con successo

        '404':
          description: Utente non trovato

        '500':
          description: Errore interno del server

  /admin/users:
    get:
      tags:
        - Admin
      summary: Recupera utenti filtrati per ruolo
      description: Restituisce la lista degli utenti filtrata per ruolo, usata dall'admin per visualizzare operatori e cittadini.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: true
          description: Ruolo da filtrare. Il valore user indica i cittadini registrati.
          schema:
            type: string
            enum:
              - operator
              - user
            example: operator
      responses:
        '200':
          description: Lista utenti recuperata con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Parametro role mancante
        '500':
          description: Errore del server

  /admin/waste-types:
    get:
      tags:
        - Admin
      summary: Recupera i tipi di rifiuto selezionabili
      description: Restituisce le categorie di rifiuto che l'admin può associare a un bidone.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista tipi di rifiuto recuperata con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "Plastica"
                  - "Vetro"
                  - "Carta"
                  - "Metallo"
        '500':
          description: Errore del server

  /admin/bins:
    get:
      tags:
        - Admin
      summary: Recupera i bidoni gestiti dall'admin
      description: Restituisce i bidoni posizionati sulla mappa con coordinate valide.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista bidoni recuperata con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bin'
        '500':
          description: Errore del server

    post:
      tags:
        - Admin
      summary: Crea un nuovo bidone
      description: >
        Crea un nuovo bidone sulla mappa. Se non viene indicato un centro di raccolta,
        il bidone viene creato come orfano e può assumere stato GUASTO.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - coordinates
                - wasteTypes
              properties:
                name:
                  type: string
                  example: "Bidone Piazza Duomo"
                address:
                  type: string
                  example: "Piazza Duomo, Trento"
                coordinates:
                  type: object
                  required:
                    - lat
                    - lng
                  properties:
                    lat:
                      type: number
                      format: double
                      example: 46.0679
                    lng:
                      type: number
                      format: double
                      example: 11.1211
                wasteTypes:
                  type: array
                  items:
                    type: string
                  example:
                    - "Plastica"
                    - "Metallo"
                centerId:
                  type: string
                  nullable: true
                  example: "665b8f5d2f9f6c0012345678"
                area:
                  type: string
                  example: "Centro"
                status:
                  type: string
                  enum:
                    - OK
                    - GUASTO
                    - MANUTENZIONE
                  example: OK
      responses:
        '201':
          description: Bidone creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '400':
          description: Dati mancanti o non validi
        '500':
          description: Errore del server

  /admin/bins/{id}/status:
    patch:
      tags:
        - Admin
      summary: Aggiorna lo stato di un bidone
      description: Aggiorna lo stato operativo di un bidone gestito dall'admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del bidone
          schema:
            type: string
            example: "665b90ad2f9f6c0012349999"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - OK
                    - GUASTO
                    - MANUTENZIONE
                  example: GUASTO
      responses:
        '200':
          description: Stato del bidone aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '400':
          description: Stato o ID non valido
        '404':
          description: Bidone non trovato
        '500':
          description: Errore del server

  /admin/bins/{id}:
    delete:
      tags:
        - Admin
      summary: Elimina un bidone
      description: Elimina definitivamente un bidone dal database.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del bidone da eliminare
          schema:
            type: string
            example: "665b90ad2f9f6c0012349999"
      responses:
        '200':
          description: Bidone eliminato con successo
        '400':
          description: ID del bidone non valido
        '404':
          description: Bidone non trovato
        '500':
          description: Errore del server

  /admin/centers:
    post:
      tags:
        - Admin
      summary: Crea un nuovo centro di raccolta
      description: >
        Crea un centro di raccolta sulla mappa. Se è il primo centro della zona,
        può assegnare automaticamente i bidoni orfani della stessa area.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - area
                - coordinates
              properties:
                name:
                  type: string
                  example: "Centro Raccolta Centro"
                address:
                  type: string
                  example: "Via Roma 10, Trento"
                area:
                  type: string
                  example: "Centro"
                coordinates:
                  type: object
                  required:
                    - lat
                    - lng
                  properties:
                    lat:
                      type: number
                      format: double
                      example: 46.0679
                    lng:
                      type: number
                      format: double
                      example: 11.1211
                openingHours:
                  type: string
                  example: "08:00-18:00"
      responses:
        '201':
          description: Centro di raccolta creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
        '400':
          description: Dati mancanti o non validi
        '500':
          description: Errore del server

  /off/product/{barcode}:
    get:
      tags:
        - OFF
      summary: Recupera dati prodotto tramite barcode
      description: >
        Invia una richiesta proxy a `https://world.openfoodfacts.org/api/v0/product/{barcode}.json`
        e restituisce il payload originale al frontend. Non richiede autenticazione.
        Per la versione con categorie di smaltimento pre-calcolate, usare `GET /api/zx/scan/{barcode}`.
      parameters:
        - name: barcode
          in: path
          required: true
          description: Codice a barre del prodotto (EAN-13, EAN-8, UPC, ecc.)
          schema:
            type: string
            example: "3017620422003"
      responses:
        '200':
          description: Prodotto trovato — payload originale di Open Food Facts

        '400':
          description: Parametro barcode assente

        '404':
          description: Prodotto non trovato nel database Open Food Facts

        '500':
          description: Errore di rete o risposta non valida da Open Food Facts

  /ofm/config:
    get:
      tags:
        - OFM
      summary: Recupera la configurazione della mappa
      description: >
        Restituisce i parametri di inizializzazione per la mappa interattiva:
        URL dello stile vettoriale OpenFreeMap, coordinate del centro iniziale
        (Trento, Italia) e livello di zoom. Non richiede autenticazione.
      responses:
        '200':
          description: Configurazione mappa restituita con successo
  
  /osm/search:
    get:
      tags:
        - OSM
      summary: Ricerca per testo (geocoding diretto)
      description: >
        Delega la ricerca al geocoder Nominatim di OpenStreetMap tramite
        `https://nominatim.openstreetmap.org/search`. Restituisce un array di
        luoghi corrispondenti alla stringa di ricerca, ordinati per rilevanza.
        Non richiede autenticazione.
      parameters:
        - name: q
          in: query
          required: true
          description: Stringa di ricerca libera (indirizzo, luogo, punto di interesse)
          schema:
            type: string
            example: "Piazza Dante, Trento"
        - name: limit
          in: query
          required: false
          description: Numero massimo di risultati (default 5)
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 50
            example: 5
      responses:
        '200':
          description: Lista di risultati Nominatim

        '400':
          description: Parametro q assente

        '500':
          description: Errore di rete o risposta non valida da Nominatim

  /osm/reverse:
    get:
      tags:
        - OSM
      summary: Geocoding inverso (coordinate → indirizzo)
      description: >
        Converte una coppia di coordinate geografiche in un indirizzo leggibile
        delegando la richiesta a `https://nominatim.openstreetmap.org/reverse`.
        Non richiede autenticazione.
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitudine in gradi decimali
          schema:
            type: number
            format: double
            example: 46.0679
        - name: lon
          in: query
          required: true
          description: Longitudine in gradi decimali
          schema:
            type: number
            format: double
            example: 11.1211
      responses:
        '200':
          description: Indirizzo corrispondente alle coordinate fornite
        '400':
          description: Parametri lat o lon assenti
        '500':
          description: Errore di rete o risposta non valida da Nominatim

  /zx/scan/{barcode}:
    get:
      tags:
        - ZX
      summary: Scansiona barcode, ottieni istruzioni di smaltimento e assegna punti
      description: >
        Recupera i dati del prodotto da Open Food Facts tramite barcode, calcola le categorie
        di smaltimento e, se viene passato userId, gestisce l'assegnazione dei punti per
        scansione. I punti base sono 5, possono essere moltiplicati da eventi attivi e sono
        soggetti a cooldown di 10 minuti. La risposta include anche i dati per il timer della
        prossima scansione premiata.
      parameters:
        - name: barcode
          in: path
          required: true
          description: Codice a barre del prodotto
          schema:
            type: string
            example: "3017620422003"
        - name: userId
          in: query
          required: false
          description: ID dell'utente a cui assegnare i punti scansione
          schema:
            type: string
            example: "683a7e4f9b12c8a12345678"
      responses:
        '200':
          description: Prodotto trovato, categorie di smaltimento calcolate e stato punti restituito
        '400':
          description: Parametro barcode assente
        '404':
          description: Prodotto non trovato nel database Open Food Facts
        '504':
          description: Timeout nella ricerca del prodotto
        '500':
          description: Errore generico durante il recupero dei dati
          
  /report/create:
    post:
      summary: Crea un nuovo report
      description: Crea una segnalazione associata a un bidone e imposta lo stato del bidone a "SEGNALATO".
      tags:
        - Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - binId
                - description
              properties:
                userId:
                  type: string
                  description: ID dell'utente che crea la segnalazione
                  example: "683a7e4f9b12c8a12345678"
                binId:
                  type: string
                  description: ID del bidone segnalato
                  example: "683a7e4f9b12c8a87654321"
                description:
                  type: string
                  description: Descrizione del problema
                  example: "Il bidone è danneggiato e non si chiude."
      responses:
        '201':
          description: Report creato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Report creato con successo
                  report:
                    $ref: '#/components/schemas/Report'

        '400':
          description: Descrizione mancante o non valida
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: La descrizione è obbligatoria

        '404':
          description: Bidone non trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bidone non trovato

        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Errore interno del server durante la creazione del report
  /report/all:
      get:
        summary: Recupera tutte le segnalazioni
        description: Restituisce l'elenco completo delle segnalazioni con informazioni sull'utente, sul bidone e sul centro di raccolta associato.
        tags:
          - Reports

        responses:
          '200':
            description: Lista delle segnalazioni recuperata con successo
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      type: boolean
                      example: true

                    reports:
                      type: array

          '500':
            description: Errore interno del server

  /report/update/{reportId}:
    put:
      summary: Aggiorna lo stato di una segnalazione e assegna punti se accettata
      description: |
        Aggiorna lo stato di una segnalazione.

        Comportamento:
        - IN_PROGRESS → il bidone passa in MANUTENZIONE e l'utente riceve 10 punti, solo la prima volta che la segnalazione viene accettata
        - RESOLVED → il bidone torna in OK e il report viene eliminato
        - REJECTED → il bidone torna in OK e il report viene eliminato
      tags:
        - Reports
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
          description: ID del report da aggiornare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - IN_PROGRESS
                    - RESOLVED
                    - REJECTED
                  example: IN_PROGRESS
      responses:
        '200':
          description: Stato aggiornato con successo
        '404':
          description: Report non trovato
        '500':
          description: Errore interno del server
    
  /report/assign/{reportId}:
    put:
      summary: Assegna una segnalazione a un operatore
      description: Assegna una segnalazione a un operatore e imposta lo stato della segnalazione ad ASSIGNED.
      tags:
        - Reports
      parameters:
        - name: reportId
          in: path
          required: true
          description: ID della segnalazione da assegnare
          schema:
            type: string
            example: "683a7e4f9b12c8a99999999"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assignedTo
              properties:
                assignedTo:
                  type: string
                  description: ID dell'operatore assegnato
                  example: "683a7e4f9b12c8a55555555"
      responses:
        '200':
          description: Operatore assegnato con successo
        '400':
          description: ID operatore mancante
        '404':
          description: Segnalazione non trovata
        '500':
          description: Errore del server
    
  /rewards:
    get:
      tags:
        - Rewards
      summary: Recupera la lista dei premi disponibili
      description: >
        Restituisce la lista dei premi disponibili ordinati per costo in punti,
        includendo le informazioni dell'attività commerciale partner associata.
      responses:
        '200':
          description: Lista premi recuperata con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reward'
        '500':
          description: Errore server

  /centers/all:
    get:
      tags:
        - Centers
      summary: Recupera tutti i centri di raccolta
      description: Restituisce la lista completa dei centri di raccolta presenti nel database.
      responses:
        '200':
          description: Lista dei centri recuperata con successo

        '500':
          description: Errore interno del server

  /centers/{id}:
    get:
      tags:
        - Centers
      summary: Recupera un centro di raccolta con i suoi bidoni
      description: Restituisce i dettagli di un centro di raccolta specifico insieme ai bidoni associati.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del centro di raccolta
          schema:
            type: string
      responses:
        '200':
          description: Centro di raccolta recuperato con successo

        '400':
          description: ID del centro non valido

        '404':
          description: Centro di raccolta non trovato

        '500':
          description: Errore interno del server

  /centers/bins:
    get:
      tags:
        - Centers
      summary: Recupera tutti i bidoni visibili sulla mappa
      description: Restituisce i bidoni con coordinate valide, usati nelle mappe di cittadini e operatori.
      responses:
        '200':
          description: Lista bidoni recuperata con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bin'
        '500':
          description: Errore interno del server

    /centers/bins/{binId}/fill-level:
    get:
      tags:
        - Centers
      summary: Recupera il livello di riempimento di un bidone
      description: >
        Restituisce il livello di riempimento aggiornato del bidone e le informazioni
        da mostrare nell'interfaccia operatore.
      parameters:
        - name: binId
          in: path
          required: true
          description: ID del bidone
          schema:
            type: string
            example: "683a7e4f9b12c8a87654321"
      responses:
        '200':
          description: Livello di riempimento recuperato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bin'
        '404':
          description: Bidone non trovato
        '500':
          description: Errore server

  /operator/optimized-route/{operatorId}:
    get:
      tags:
        - Operator
      summary: Genera il percorso ottimizzato dell'operatore
      description: >
        Restituisce le tappe da visitare per l'operatore, combinando segnalazioni assegnate
        e bidoni pieni con livello di riempimento almeno pari all'80%.
      parameters:
        - name: operatorId
          in: path
          required: true
          description: ID dell'operatore
          schema:
            type: string
            example: "683a7e4f9b12c8a55555555"
      responses:
        '200':
          description: Percorso generato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  tappe:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteStop'
        '500':
          description: Errore nel generare il percorso ottimizzato

  /events/all:
    get:
      tags:
        - Events
      summary: Recupera tutti gli eventi di raccolta
      description: Restituisce tutti gli eventi di raccolta visibili su mappa da admin e cittadini.
      responses:
        '200':
          description: Lista eventi recuperata con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '500':
          description: Errore del server

  /events:
    post:
      tags:
        - Events
      summary: Crea un evento di raccolta
      description: Crea un nuovo evento di raccolta con area, raggio, categorie di rifiuto potenziate, boost e date.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Evento creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Dati evento non validi
        '500':
          description: Errore del server

  /events/{id}:
    patch:
      tags:
        - Events
      summary: Modifica un evento di raccolta
      description: Modifica i dati di un evento di raccolta esistente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'evento
          schema:
            type: string
            example: "665b90ad2f9f6c0012348888"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Evento modificato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Dati evento o ID non validi
        '404':
          description: Evento non trovato
        '500':
          description: Errore del server

    delete:
      tags:
        - Events
      summary: Elimina un evento di raccolta
      description: Elimina definitivamente un evento di raccolta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'evento
          schema:
            type: string
            example: "665b90ad2f9f6c0012348888"
      responses:
        '200':
          description: Evento eliminato con successo
        '400':
          description: ID evento non valido
        '404':
          description: Evento non trovato
        '500':
          description: Errore del server

  /events/settle:
    post:
      tags:
        - Events
      summary: Liquida gli eventi conclusi dell'utente
      description: >
        Assegna i punti di partecipazione agli eventi conclusi a cui l'utente ha partecipato
        e per cui non ha ancora ricevuto la ricompensa.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Eventi liquidati con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "665b90ad2f9f6c0012348888"
                        name:
                          type: string
                          example: "Evento raccolta plastica"
                  pointsPerEvent:
                    type: number
                    example: 10
                  pointsAwarded:
                    type: number
                    example: 20
                  totalPoints:
                    type: number
                    example: 150
        '401':
          description: Utente non autenticato
        '500':
          description: Errore del server

  /events/{id}/join:
    post:
      tags:
        - Events
      summary: Iscrive l'utente a un evento
      description: Iscrive l'utente autenticato a un evento di raccolta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'evento
          schema:
            type: string
            example: "665b90ad2f9f6c0012348888"
      responses:
        '200':
          description: Iscrizione effettuata con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Iscrizione effettuata"
                  event:
                    $ref: '#/components/schemas/Event'
        '400':
          description: ID evento non valido
        '401':
          description: Utente non autenticato
        '404':
          description: Evento non trovato
        '500':
          description: Errore del server

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    User:
      type: object
      properties:
        _id:
          type: string
          example: 665ba1cd2f9f6c001234abcd

        name:
          type: string
          example: Mario Rossi
          description: Nome completo dell'utente

        email:
          type: string
          format: email
          example: mario.rossi@example.com
          description: Email dell'utente

        passwordHash:
          type: string
          example: $2b$10$abcdefghilmnopqrstuv
          description: Password criptata dell'utente

        role:
          type: string
          enum:
            - registered_user
            - operator
            - admin
          example: registered_user
          description: Ruolo dell'utente nel sistema

        points:
          type: number
          example: 120
          description: Punti accumulati dall'utente

        employeeCode:
          type: string
          nullable: true
          example: EMP001
          description: Codice identificativo dell'operatore

        assignedRouteId:
          type: string
          nullable: true
          example: 665bc2222f9f6c001239999
          description: ID della route assegnata all'operatore

        accessLevel:
          type: number
          nullable: true
          example: 2
          description: Livello di accesso dell'utente

        isVerified:
          type: boolean
          example: true
          description: Stato di verifica dell'account

        verificationToken:
          type: string
          nullable: true
          example: verify_token_123456
          description: Token per la verifica email

        passwordResetToken:
          type: string
          nullable: true
          example: reset_token_abcdef
          description: Token per il reset della password

        createdAt:
          type: string
          format: date-time
          example: 2026-05-16T10:00:00.000Z

      required:
        - name
        - email
        - passwordHash

    Bin:
      type: object
      properties:
        _id:
          type: string
          example: "665b90ad2f9f6c0012349999"

        binCode:
          type: string
          example: "BIN001"
          description: Codice univoco del bidone

        name:
          type: string
          example: "Bidone Piazza Duomo"
          description: Nome leggibile del bidone

        address:
          type: string
          example: "Via Roma 10, Trento"
          description: Indirizzo del bidone

        wasteType:
          type: string
          example: "plastica"
          description: Tipo principale di rifiuto del bidone

        wasteTypes:
          type: array
          items:
            type: string
          example:
            - "plastica"
            - "metallo"
          description: Tipi di rifiuto accettati dal bidone

        coordinates:
          type: object
          properties:
            lat:
              type: number
              format: double
              example: 46.0679
            lng:
              type: number
              format: double
              example: 11.1211
          description: Coordinate del bidone sulla mappa

        area:
          type: string
          example: "Centro"
          description: Area o quartiere del bidone

        fillLevel:
          type: number
          minimum: 0
          maximum: 100
          example: 75
          description: Percentuale di riempimento del bidone

        status:
          type: string
          enum:
            - OK
            - MANUTENZIONE
            - PIENO
            - SEGNALATO
            - GUASTO
          example: OK
          description: Stato operativo del bidone

        centerId:
          type: string
          nullable: true
          example: "665b8f5d2f9f6c0012345678"
          description: ID del centro di raccolta associato, se presente

        sensor:
          type: object
          properties:
            sensorCode:
              type: string
              example: "SENS123"

            batteryLevel:
              type: number
              minimum: 0
              maximum: 100
              example: 87

            lastUpdate:
              type: string
              format: date-time
              example: "2026-05-16T10:30:00.000Z"

        createdAt:
          type: string
          format: date-time
          example: "2026-05-16T10:00:00.000Z"

        updatedAt:
          type: string
          format: date-time
          example: "2026-05-16T10:30:00.000Z"

      required:
        - binCode
        - fillLevel
        - status
    Center:
      type: object
      properties:
        _id:
          type: string
          example: 665b8f5d2f9f6c0012345678

        name:
          type: string
          example: Centro Raccolta Milano Nord
          description: Nome del centro di raccolta

        address:
          type: string
          example: Via Roma 10
          description: Indirizzo del centro

        area:
          type: string
          example: Milano Nord
          description: Area geografica del centro di raccolta

        openingHours:
          type: string
          example: Lun-Ven 8:00-18:00, Sab 9:00-13:00, Dom chiuso
          description: Orari di apertura del centro

        coordinates:
          type: object
          properties:
            lat:
              type: number
              format: double
              example: 45.4642

            lng:
              type: number
              format: double
              example: 9.1900

        createdAt:
          type: string
          format: date-time
          example: 2026-05-16T09:00:00.000Z

      required:
        - name
        - address
        - area
        - coordinates

    Report:
      type: object
      required:
        - userId
        - binId
        - description
        - status
      properties:
        _id:
          type: string
          description: ID univoco del report
          example: "683a7e4f9b12c8a99999999"

        userId:
          type: string
          description: ID dell'utente che ha creato la segnalazione
          example: "683a7e4f9b12c8a12345678"

        binId:
          type: string
          description: ID del bidone segnalato
          example: "683a7e4f9b12c8a87654321"

        description:
          type: string
          description: Descrizione del problema riscontrato
          example: "Il bidone è danneggiato e non si chiude."

        status:
          type: string
          description: Stato della segnalazione
          enum:
            - PENDING
            - IN_PROGRESS
            - RESOLVED
            - REJECTED
            - ASSIGNED
          example: PENDING

        assignedTo:
          type: string
          nullable: true
          description: Operatore assegnato alla gestione della segnalazione
          example: "683a7e4f9b12c8a55555555"

        createdAt:
          type: string
          format: date-time
          description: Data di creazione del report
          example: "2025-06-01T12:34:56.000Z"

        updatedAt:
          type: string
          format: date-time
          description: Data dell'ultima modifica del report
          example: "2025-06-01T12:34:56.000Z"

    Reward:
      type: object
      properties:
        _id:
          type: string
          example: "683a7e4f9b12c8a77777777"

        name:
          type: string
          example: "Sconto 10%"

        description:
          type: string
          example: "Sconto del 10% presso l'attività partner"

        pointsCost:
          type: number
          example: 100

        availability:
          type: number
          example: 25

        partnerName:
          type: string
          example: "Eco Market Trento"

        partnerAddress:
          type: string
          example: "Via Roma 10, Trento"

        partnerActive:
          type: boolean
          example: true

    RouteStop:
      type: object
      properties:
        id:
          type: string
          example: "683a7e4f9b12c8a99999999"

        type:
          type: string
          enum:
            - INTERVENTO
            - SVUOTAMENTO
          example: INTERVENTO

        titolo:
          type: string
          example: "Intervento: Bidone danneggiato"

        indirizzo:
          type: string
          example: "Via Roma 10, Trento"

        coordinate:
          type: object
          properties:
            lat:
              type: number
              format: double
              example: 46.0679
            lng:
              type: number
              format: double
              example: 11.1211

    EventInput:
      type: object
      required:
        - name
        - coordinates
        - radius
        - wasteTypes
        - boost
        - startDate
        - endDate
      properties:
        name:
          type: string
          example: "Evento raccolta plastica"
        coordinates:
          type: object
          required:
            - lat
            - lng
          properties:
            lat:
              type: number
              format: double
              example: 46.0679
            lng:
              type: number
              format: double
              example: 11.1211
        radius:
          type: number
          example: 500
          description: Raggio dell'evento in metri
        wasteTypes:
          type: array
          items:
            type: string
          example:
            - "Plastica"
            - "Metallo"
        boost:
          type: number
          enum:
            - 2
            - 3
            - 5
            - 10
          example: 2
          description: Moltiplicatore dei punti scansione durante l'evento
        startDate:
          type: string
          format: date-time
          example: "2026-06-10T09:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-06-10T18:00:00.000Z"
        area:
          type: string
          example: "Centro"

    Event:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            _id:
              type: string
              example: "665b90ad2f9f6c0012348888"
            participants:
              type: array
              items:
                type: string
              example:
                - "665b90ad2f9f6c0012341111"
            rewardedParticipants:
              type: array
              items:
                type: string
              example:
                - "665b90ad2f9f6c0012341111"
            createdAt:
              type: string
              format: date-time
              example: "2026-06-10T08:30:00.000Z"
            updatedAt:
              type: string
              format: date-time
              example: "2026-06-10T08:45:00.000Z"
